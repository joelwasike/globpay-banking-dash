# Nginx config for Vite SPA (Globpay Dashboard)
# Copy this to your server and set root to the directory containing your built app
# (the folder that contains index.html, js/, css/, images/, fonts/).

server {
    listen 80;
    server_name pay.globpay.ai;
    root /var/www/html;
    index index.html;

    # Serve .js files with correct MIME type (fixes "Expected a JavaScript module" error)
    location ~ \.js$ {
        default_type application/javascript;
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve .css files with correct MIME type
    location ~ \.css$ {
        default_type text/css;
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: serve index.html only for non-file requests
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
